# Odoo 19 + PostgreSQL 16 + Parse service, for local development and testing.
# Usage: cp parse-service/.env.example parse-service/.env, set GEMINI_API_KEY, then: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data

  web:
    image: odoo:19.0
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./:/mnt/extra-addons          # this repository: Odoo finds the parse_receipt module here

  parse:
    build: ./parse-service
    env_file:
      - ./parse-service/.env          # GEMINI_API_KEY, PARSE_MODEL, PARSE_N_AGENTS, PARSE_TIMEOUT_SEC
    ports:
      - "127.0.0.1:8001:8000"         # local access for tests only; Odoo uses http://parse:8000

volumes:
  odoo-db-data:
  odoo-web-data:
